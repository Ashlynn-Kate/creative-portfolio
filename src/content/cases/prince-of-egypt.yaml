cover:
  src: prince-of-egypt/palace.png
  alt: Dancers in white on a palace set lit in pale blue, with a golden throne at stage left.

blocks:
  - type: text
    body: |
      The Prince of Egypt brings its story to the stage through contemporary ballet, combining an ensemble of young dancers with professional guest artists.

      As creator and director, I developed the production’s storyline and flow, led casting, selected and edited the music, developed costumes, and choreographed 23 of its 28 pieces.

  - type: credits
    lines:
      - Creation, Direction, & Choreography · Ashlynn Kate

  - type: image-feature
    image:
      src: prince-of-egypt/deliver-us-image-3.png
      alt: Dancers in earth-toned costumes reaching forward onstage before a desert backdrop.
    heading: Shaping the Production
    body: |
      Movement, music, costumes, makeup, and the stage environment developed together around the story. I gave the set team visual references and direction for where elements would be placed onstage, and worked with the lighting team to shape the look of each scene.

      The throne, sandy backdrop, and opening scene shown below trace that process from reference images and early concepts to the finished stage.

      I also guided the rehearsal process and coordinated the production’s evolving details with the studio and creative team.

