  - type: heading
    text: Project overview

  - type: text
    body: |
      I created and directed *The Prince of Egypt*, a full-length contemporary ballet for an arts studio serving ages 3–18. The production comprised 28 pieces, 23 of which I choreographed, and included collaborations with professional guest artists. I guided the project from its story and early concepts through the finished stage production.

  - type: image
    size: full
    src: prince-of-egypt/palace.png
    alt: Dancers in white on a palace set lit in pale blue, with a golden throne at stage left.

  - type: details
    summary: Creative direction
    blocks:
      - type: text
        body: |
          I wrote the primary story, cast the performers, and selected and edited the music. I led costume and makeup decisions and collaborated with the relevant teams on set and lighting ideas. The throne, sandy backdrop, and opening scene examples below show how those ideas developed into what audiences saw onstage.

  - type: details
    summary: Production and handoffs
    blocks:
      - type: text
        body: |
          Turning those ideas into a full-length production required keeping people informed as details evolved. I planned rehearsals, tracked changes to music and costume decisions, and sent collaborators the current files they needed for their work. I kept the studio owner updated on the production’s progress throughout.

