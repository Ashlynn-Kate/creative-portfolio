  - type: story-chapter
    id: socrates
    character: Socrates
    title: The unexamined life
    image:
      src: gift-of-athens/socrates.png
      alt: The dancer portraying Socrates in a gold-toned costume, seated on stone steps.
    intro: Socrates encouraged people to examine their lives, question their assumptions, and seek wisdom through dialogue. He valued knowledge over wealth and believed that living justly mattered more than personal comfort or material possessions.
    sections:
      - heading: A final choice
        body: Condemned to death in Athens, Socrates faces the choice of escaping or accepting his sentence. Drawing on Plato’s account, this scene portrays his decision to drink hemlock rather than pursue an escape he believes would violate his principles. The dance explores the weight of that choice and his commitment to living by what he taught.
        video:
          compact: true
          captionOnImage: true
          thumbnail:
            src: gift-of-athens/socrates-plato-duet.jpeg
            alt: Socrates and Plato performing a duet outdoors; opens the Death of Socrates scene excerpt on Google Drive.
          url: https://drive.google.com/file/d/1Bs83eNmkXv0BnIZ5B0NYK4FivgOGiKt5/view
          caption: Death of Socrates

  - type: story-chapter
    id: plato
    character: Plato
    title: Beyond appearance
    image:
      src: gift-of-athens/plato.png
      alt: The dancer portraying Plato in a white costume on pale stone steps.
    intro: Socrates’ execution profoundly affected Plato, sharpening his concern with justice and political life. As Socrates’ student, he carried forward his teacher’s search for truth and virtue. After a period of travel, he founded the Academy in Athens, where Aristotle would later study under him.
    sections:
      - video:
          compact: true
          thumbnail:
            src: gift-of-athens/socrates-plato-duet.jpeg
            alt: Socrates and Plato performing a duet outdoors; opens the scene excerpt on Google Drive.
          url: https://drive.google.com/file/d/1gjTVYO1I9x8tfQ37YQL2jMwfTEdRXpbS/view
          caption: Plato Mourns
      - heading: The Allegory of the Cave
        body: |
          Plato explored how reason and education could lead beyond appearances toward enduring truths, which he called Forms.

          Prisoners in a cave mistake shadows on a wall for reality until one escapes and discovers the world outside. His journey into the light, and his return to those still imprisoned, explore the difficulty of questioning what we know and the responsibility that comes with understanding.
        video:
          compact: true
          thumbnail:
            src: gift-of-athens/allegory-dancers.jpeg
            alt: Two dancers in white and blue costumes; opens the scene excerpt on Google Drive.
          url: https://drive.google.com/file/d/17sQGyr9BmuArytQH5DNs5I2Mhub19nfS/view
          caption: The Allegory of the Cave

  - type: story-chapter
    id: aristotle
    character: Aristotle
    title: A path of his own
    image:
      src: gift-of-athens/aristotle.jpeg
      alt: The dancer portraying Aristotle in a blue costume among classical columns.
    intro: Aristotle studied under Plato for nearly twenty years, developing his thinking through both his teacher’s influence and his questioning of Plato’s ideas. He used observation and reason to explore the natural world, asking how things change, develop, and fulfill their potential.
    sections:
      - heading: The Unmoved Mover
        body: Aristotle’s inquiry into motion led to the theory of the Unmoved Mover, an eternal, unchanging source of the universe’s motion that is not itself moved by anything else. The theory seeks to explain how eternal movement is sustained.
