order: 1
title: Object Translations
indexTitle: Object Translations Portfolio
kicker: Editorial portraits
meta: Independent series
summary: Everyday objects translated into human-form editorial portraits through
  color, shape, texture, wardrobe, pose, and light.
disciplines:
  - Photography
  - Creative Direction
  - Styling
cover:
  src: object-translations/feather-bag-portrait.jpeg
  alt: A woman in a black halter top and full black tulle skirt, mid-turn against
    a pale backdrop.
blocks:
  - type: text
    body: >
      For this independent series, I start with an object and draw from elements
      such as its color, shape, texture, or character, and translate that into a
      human-form editorial portrait. I develop a visual concept around it, then
      make choices about wardrobe, pose, framing, and light to carry that idea
      through to the finished image. Each group below shows the object that
      sparked the concept alongside the final portrait.
  - type: preview-gallery
    label: Object Translations portrait preview gallery
    images:
      - src: object-translations/preview-feather.png
        alt: A woman seated in a black tulle dress against a pale backdrop.
      - src: object-translations/preview-sharpie.png
        alt: A woman in a white blazer holding glasses, photographed from above.
      - src: object-translations/preview-louboutin.png
        alt: A close-up portrait of a woman in a pink dress wearing pale green gloves.
      - src: object-translations/preview-champagne.png
        alt: A full-body portrait of a woman in a cream top and champagne skirt with a shadow behind her.
  - type: page-link
    item: object-translations/all-concepts
