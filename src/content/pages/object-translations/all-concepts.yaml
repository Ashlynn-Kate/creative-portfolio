case: object-translations
order: 1
title: Conceptual Portraits
sub: Object Translations · Independent series
summary: The complete Object Translations series, from everyday objects to
  conceptual portraits.
cover:
  src: object-translations/disco-ball-portrait.jpeg
  alt: A portrait inspired by a disco ball.
blocks:
  - type: text
    order: 0
    size: wide
    body: >
      For this independent series, I start with an object and translate its color,
      shape, texture, or character into a portrait. I develop and direct each
      concept, select and style the wardrobe, photograph and edit the images,
      and appear in every portrait. Each group below shows the object that
      sparked the concept alongside the final portrait.
  - type: details
    summary: Feather bag
    order: 1
    sub: Volume · Texture · Drama
    thumbnail:
      src: object-translations/feather-bag-object.jpeg
      alt: A black feather-trimmed evening bag.
    blocks:
      - type: grid
        labels:
          - Object
          - Portrait
        images:
          - src: object-translations/feather-bag-object.jpeg
            alt: A black feather-trimmed evening bag with a gold frame, ball clasp, and slim
              gold strap.
          - src: object-translations/feather-bag-portrait.jpeg
            alt: A woman in a black halter top and full black tulle skirt, mid-turn against
              a pale backdrop.
      - type: details
        summary: Behind the translation
        blocks:
          - type: text
            body: >
              I echoed the bag’s full, feathery bottom and its minimal, empty
              strap, and wanted to play on that contrast and shape in my
              translation. The volume of the outfit lessens as you move from the
              skirt to the head.
      - type: details
        summary: Additional photos
        blocks:
          - type: carousel
            label: Additional Feather Bag photos
            images:
              - src: object-translations/feather-bag-detail.jpeg
                alt: Seated with hands on hips, the black tulle skirt fanned out in a circle on
                  the floor.
                caption: Hair draws from the bag’s ball clasp, while the skirt fans out like its
                  feathers.
              - src: object-translations/feather-bag-02.png
                alt: Additional portrait from the Feather Bag concept.
              - src: object-translations/feather-bag-04.png
                alt: Full-length Feather Bag portrait in a black tulle gown.
              - src: object-translations/feather-bag-03.png
                alt: Additional portrait from the Feather Bag concept.
  - type: details
    summary: Vintage lamp
    order: 7
    sub: Shape · Colors · Light
    thumbnail:
      src: object-translations/lamp-object.png
      alt: A vintage table lamp.
    blocks:
      - type: grid
        labels:
          - Object
          - Portrait
        images:
          - src: object-translations/lamp-object.png
            alt: A vintage table lamp with a scalloped cream shade trimmed in gold and a
              smoky green glass base.
          - src: object-translations/lamp-portrait.jpeg
            alt: A woman in a white blouse and olive satin trousers, head tilted down, one
              hand in her hair, in warm light.
      - type: details
        summary: Behind the translation
        blocks:
          - type: text
            body: >
              I translated not only the colors of the overall image and lamp,
              but also the rounded, unusual standing shape of the lamp, and a
              downward gaze inspired by the downward direction of the shade.
      - type: details
        summary: Additional photos
        blocks:
          - type: carousel
            label: Additional Vintage Lamp photos
            images:
              - src: object-translations/lamp-detail.jpeg
                alt: Close portrait in a white blouse with layered gold necklaces, lit by warm
                  directional light.
                caption: A layered necklace echoes the lamp shade’s gold detailing, lit as if by
                  the lamp.
              - src: object-translations/lamp-02.png
                alt: Additional portrait from the Vintage Lamp concept.
  - type: details
    summary: Sharpie Highlighter
    order: 5
    sub: Color · Contrast · Sharp Lines
    thumbnail:
      src: object-translations/sharpie-object.png
      alt: A pink Sharpie highlighter.
    blocks:
      - type: grid
        labels:
          - Object
          - Portrait
        images:
          - src: object-translations/sharpie-object.png
            alt: A pink Sharpie highlighter.
          - src: object-translations/sharpie-portrait.jpeg
            alt: A woman in a white blazer and pink heels seated on a black cube, casting
              crisp shadows on a white wall.
      - type: details
        summary: Behind the translation
        blocks:
          - type: text
            body: >
              The pink heels pick up the highlighter’s color; the white blazer,
              black cube, and crisp shadows give the portrait its graphic feel.
              The idea was to draw out a corporate, focused, attention-to-detail
              feeling.
      - type: details
        summary: Additional photos
        blocks:
          - type: carousel
            label: Additional Sharpie photos
            images:
              - src: object-translations/sharpie-detail.jpeg
                alt: Close-up from above of a woman in a white blazer holding black glasses,
                  wearing straight black earrings.
                caption: The straight black earrings draw from the highlighter’s minimal
                  wordmark and its quick, clear focus.
              - src: object-translations/sharpie-02.png
                alt: Additional portrait from the Sharpie concept.
  - type: details
    summary: Disco Ball
    order: 2
    sub: Perspective · Energy · Bold Colors
    thumbnail:
      src: object-translations/disco-ball-object.jpeg
      alt: A disco ball.
    blocks:
      - type: grid
        labels:
          - Object
          - Portrait
        images:
          - src: object-translations/disco-ball-object.jpeg
            alt: A disco ball suspended from the ceiling.
          - src: object-translations/disco-ball-portrait.jpeg
            alt: A portrait inspired by the color, perspective, and reflectiveness of a
              disco ball.
      - type: details
        summary: Behind the translation
        blocks:
          - type: text
            body: >
              I wanted to capture the object image’s saturated, bold colors, the
              upward perspective of looking at a disco ball on the ceiling, and
              its reflectiveness. A direct look into the camera evokes staring
              into a mirror—or into the disco ball itself.
      - type: details
        summary: Additional photos
        blocks:
          - type: carousel
            label: Additional Disco Ball photos
            images:
              - src: object-translations/disco-ball-01.jpeg
                alt: Additional portrait from the Disco Ball concept.
              - src: object-translations/disco-ball-02.jpeg
                alt: Additional portrait from the Disco Ball concept.
              - src: object-translations/disco-ball-03.png
                alt: Additional portrait from the Disco Ball concept.
              - src: object-translations/disco-ball-04.jpeg
                alt: Additional portrait from the Disco Ball concept.
  - type: details
    summary: Bronze Heel
    order: 9
    sub: Subtlety · Elegance · Stillness
    thumbnail:
      src: object-translations/bronze-heel-thumbnail.png
      alt: A bronze slingback heel.
    blocks:
      - type: grid
        labels:
          - Object
          - Portrait
        images:
          - src: object-translations/bronze-heel-object.png
            alt: A low bronze slingback heel.
          - src: object-translations/bronze-heel-portrait.jpeg
            alt: A portrait in a draped dress inspired by a bronze slingback heel.
      - type: details
        summary: Behind the translation
        blocks:
          - type: text
            body: >
              For the bronze shoe, I wanted to highlight the simplicity of the
              object. Turning the face away reflects the simplicity of the low
              heel, while the draped back of the dress mirrors the shoe’s
              slingback strap.
      - type: details
        summary: Additional photos
        blocks:
          - type: carousel
            label: Additional Bronze Heel photos
            images:
              - src: object-translations/bronze-heel-01.jpeg
                alt: Additional portrait from the Bronze Heel concept.
  - type: details
    summary: Lemonade Pitcher
    order: 8
    sub: Softness · Curvature · Grace
    thumbnail:
      src: object-translations/lemonade-pitcher-object.jpeg
      alt: A pale yellow lemonade pitcher.
    blocks:
      - type: grid
        labels:
          - Object
          - Portrait
        images:
          - src: object-translations/lemonade-pitcher-object.jpeg
            alt: A pale yellow lemonade pitcher with a curved green handle.
          - src: object-translations/lemonade-pitcher-01.png
            alt: A portrait inspired by the soft curves of a lemonade pitcher.
      - type: details
        summary: Behind the translation
        blocks:
          - type: text
            body: >
              For the lemonade pitcher, I focused on translating its shape
              through the body. The quiet, elegant pose reflects the pitcher’s
              silhouette, while the swoop of hair directly mirrors the curve of
              the handle.
      - type: details
        summary: Additional photos
        blocks:
          - type: carousel
            label: Additional Lemonade Pitcher photos
            images:
              - src: object-translations/lemonade-pitcher-02.jpeg
                alt: Additional portrait from the Lemonade Pitcher concept.
              - src: object-translations/lemonade-pitcher-03.png
                alt: Additional portrait from the Lemonade Pitcher concept.
  - type: details
    summary: Floral Heel
    order: 6
    sub: Contrast · Femininity · Structure
    thumbnail:
      src: object-translations/floral-heel-thumbnail.png
      alt: A black and white floral heel.
    blocks:
      - type: grid
        labels:
          - Object
          - Portrait
        images:
          - src: object-translations/lemonade-pitcher-portrait.jpeg
            alt: A black-and-white floral heel.
          - src: object-translations/floral-heel-portrait.jpeg
            alt: A portrait in a structured white dress with a black floral choker.
      - type: details
        summary: Behind the translation
        blocks:
          - type: text
            body: >
              For the floral heel, I translated the shoe’s black-and-white
              contrast through the styling. The structured white dress reflects
              its clean silhouette, while the black floral choker mirrors the
              flower at the front of the shoe.
      - type: details
        summary: Additional photos
        blocks:
          - type: carousel
            label: Additional Floral Heel photos
            images:
              - src: object-translations/floral-heel-object.jpeg
                alt: Additional portrait from the Floral Heel concept.
              - src: object-translations/floral-heel-01.png
                alt: Additional portrait from the Floral Heel concept.
              - src: object-translations/floral-heel-02.png
                alt: Additional portrait from the Floral Heel concept.
              - src: object-translations/floral-heel-03.png
                alt: Additional portrait from the Floral Heel concept.
  - type: details
    summary: Louboutin Floral Handbag
    order: 4
    sub: Pastel · Structure · Softness
    thumbnail:
      src: object-translations/louboutin-floral-handbag/object.jpeg
      alt: A pale pink Louboutin handbag.
    blocks:
      - type: grid
        labels:
          - Object
          - Portrait
        images:
          - src: object-translations/louboutin-floral-handbag/object.jpeg
            alt: A pale pink Louboutin handbag with green handles and floral details.
          - src: object-translations/louboutin-floral-handbag/01.png
            alt: A close-up portrait in a pink look with sheer sage-green gloves.
      - type: details
        summary: Behind the translation
        blocks:
          - type: text
            body: >
              Drawing on the colors of the bag, I focused on the contrast between
              its structured shape and the softness of the floral design, bringing
              those elements together through the styling. The close-ups emphasize
              the delicate quality of the colors and details.
      - type: details
        summary: Additional photos
        blocks:
          - type: carousel
            label: Additional Louboutin Floral Handbag photos
            images:
              - src: object-translations/louboutin-floral-handbag/02.png
                alt: A close-up portrait looking to the side in a pink look with sheer
                  sage-green gloves.
              - src: object-translations/louboutin-floral-handbag/03.png
                alt: A close-up portrait with hands gathered beneath the chin in sheer
                  sage-green gloves.
              - src: object-translations/louboutin-floral-handbag/04.jpeg
                alt: A full-body portrait in a pale pink dress with sheer sage-green gloves.
              - src: object-translations/louboutin-floral-handbag/05.jpeg
                alt: A full-body portrait in a pale pink dress looking to the side.
              - src: object-translations/louboutin-floral-handbag/06.png
                alt: A full-body portrait in a pale pink dress with one hand raised.
              - src: object-translations/louboutin-floral-handbag/07.png
                alt: A full-body portrait in a pale pink dress with hands gathered at the waist.
  - type: details
    summary: Tiffany & Co. Vintage Paperweight
    order: 3
    sub: Elegance · Color · Restraint
    thumbnail:
      src: object-translations/tiffany-paperweight-object.jpeg
      alt: A Tiffany and Co. vintage paperweight.
    blocks:
      - type: grid
        labels:
          - Object
          - Portrait
        images:
          - src: object-translations/tiffany-paperweight-object.jpeg
            alt: A Tiffany & Co. vintage paperweight.
          - src: object-translations/tiffany-paperweight-portrait.png
            alt: A portrait inspired by Tiffany blue and understated elegance.
      - type: details
        summary: Behind the translation
        blocks:
          - type: text
            body: >
              For Tiffany & Co., I focused on the iconic blue and the simplicity
              of the design. The oversized shirt brings the color into the
              styling, while white heels, gold jewelry, and a clean setting
              reflect the brand’s understated elegance.
      - type: details
        summary: Additional photos
        blocks:
          - type: carousel
            label: Additional Tiffany & Co. Vintage Paperweight photos
            images:
              - src: object-translations/tiffany-paperweight-01.jpeg
                alt: Additional portrait from the Tiffany & Co. Vintage Paperweight concept.
              - src: object-translations/tiffany-paperweight-02.jpeg
                alt: Additional portrait from the Tiffany & Co. Vintage Paperweight concept.
              - src: object-translations/tiffany-paperweight-03.jpeg
                alt: Additional portrait from the Tiffany & Co. Vintage Paperweight concept.
              - src: object-translations/tiffany-paperweight-04.png
                alt: Additional portrait from the Tiffany & Co. Vintage Paperweight concept.
              - src: object-translations/tiffany-paperweight-05.jpeg
                alt: Additional portrait from the Tiffany & Co. Vintage Paperweight concept.
