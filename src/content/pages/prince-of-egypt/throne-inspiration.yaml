case: prince-of-egypt
order: 1
title: Throne Inspiration
sub: The throne, from concept to stage
summary: A throne built to convey power through scale, and to move with the choreography.
cover:
  src: prince-of-egypt/throne-closeup.png
  alt: Three performers onstage in front of the finished golden throne.

blocks:
  - type: text
    body: |
      I wanted the throne to convey power through its scale, particularly when the villain takes over in Act II. I shared a size reference and that dramatic purpose with the set builder. It also needed to function as a chair and a movable set piece, so it was built on a rolling platform for transitions on and offstage and for movement within the choreography.

